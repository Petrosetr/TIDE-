name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production_ref:
        description: 'Type "main" to confirm a manual production deploy from main'
        required: true
        type: string

concurrency:
  group: production-deploy
  # Do not cancel a production deploy after it starts mutating the host.
  # The workflow snapshots + rsyncs landing and app paths separately; a
  # cancellation between those steps can leave domains on different releases.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build And Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PROD_HOST: 188.137.229.201
      # Production static deploys must never use root. Configure
      # Settings -> Actions variables -> PROD_DEPLOY_USER=tide-deploy
      # after provisioning the host user from infra/vps/README.md.
      PROD_USER: ${{ vars.PROD_DEPLOY_USER || 'tide-deploy' }}
      TIDE_DEPLOY_CHANNEL: production
      TIDE_DEPLOY_TARGET: prod
      TIDE_DEPLOY_CONFIRM_REF: ${{ github.event.inputs.confirm_production_ref || '' }}
      TIDE_ENV: production
      TIDE_LIVE_ENABLED: "false"
      PROD_LANDING_PATH: /var/www/tide/landing
      PROD_APP_PATH: /var/www/tide/app
      TIDE_LANDING_URL: https://tidesui.pro
      TIDE_WORKSPACE_URL: https://app.tidesui.pro
      TIDE_LIVE_RAIL_PACK_URL: https://app.tidesui.pro/live-rail-pack.json
      TIDE_LIVE_RAIL_PACK_FILE: shadow-mode/live-rail-pack.json
      TIDE_LIVE_RAIL_PACK_AUTOLOAD: "true"
      TIDE_LIVE_RAIL_PACK_PREFER_REMOTE: "true"
      TIDE_LIVE_RAIL_PACK_PERSIST: "true"
      TIDE_PLAUSIBLE_DOMAIN: tidesui.pro
      TIDE_SUI_NETWORK: mainnet
      TIDE_EXECUTION_PROOF_ENABLED: "false"
      TIDE_EXECUTION_PROOF_ALLOW_SIGNING: "false"
      TIDE_TELEMETRY_BEACON_URL: ${{ secrets.TELEMETRY_BEACON_URL }}
      TIDE_ERROR_BEACON_URL: ${{ secrets.ERROR_BEACON_URL }}
      TIDE_PLAUSIBLE_SCRIPT_URL: ${{ vars.PLAUSIBLE_SCRIPT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate deploy context
        run: npm run validate:deploy-context

      - name: Install dependencies
        # @7kprotocol/sdk-ts pins peer @mysten/sui@^1.44.0 but we're on
        # @mysten/sui@^2.3.1 — the API surface we use is compatible, and
        # deploy-dev.yml uses the same flag. Keep both in lockstep.
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Lint regulatory copy
        run: npm run lint:regulatory-copy

      - name: Lint Sui chain literals
        run: npm run lint:sui-chain

      - name: Collect live rails
        run: npm run collect:live-rails

      - name: Build public alpha bundle
        run: npm run build:public-alpha:configured

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright judge/setup/routing/receipt gate
        run: npm run test:playwright

      - name: Write private repository provenance fallback
        if: ${{ github.event.repository.private == true }}
        run: |
          set -euo pipefail
          mkdir -p dist/provenance
          cat > dist/provenance/private-repo-provenance.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "private": true,
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "actor": "${GITHUB_ACTOR}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "note": "GitHub repository attestations are unavailable for user-owned private repositories; this artifact preserves production build provenance until the repo is public or org-backed attestations are available."
          }
          EOF

      - name: Prepare SSH
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
          PROD_SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          out = Path.home() / ".ssh" / "id_ed25519"
          key_b64 = os.environ.get("PROD_SSH_KEY_B64", "").strip()
          key_raw = os.environ.get("PROD_SSH_KEY", "")

          if key_b64:
            data = base64.b64decode(key_b64)
            out.write_bytes(data)
          else:
            if "\\n" in key_raw and "\n" not in key_raw.strip():
              key_raw = key_raw.replace("\\n", "\n")
            key_raw = key_raw.replace("\r\n", "\n").replace("\r", "\n")
            if not key_raw.strip():
              raise SystemExit("PROD_SSH_KEY is empty.")
            out.write_text(key_raw if key_raw.endswith("\n") else key_raw + "\n", encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
            ServerAliveCountMax 8
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config
          if [ -z "${PROD_SSH_HOST_KEY:-}" ]; then
            echo "PROD_SSH_HOST_KEY secret is required for pinned SSH host verification." >&2
            exit 1
          fi
          printf '%s\n' "$PROD_SSH_HOST_KEY" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Upload build artifact (rollback source)
        uses: actions/upload-artifact@v4
        with:
          name: public-alpha-${{ github.sha }}
          path: dist/public-alpha/
          retention-days: 30
          if-no-files-found: error

      - name: Upload private repository provenance fallback
        if: ${{ github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: private-repo-provenance-${{ github.sha }}
          path: dist/provenance/private-repo-provenance.json
          retention-days: 30
          if-no-files-found: error

      - name: Snapshot previous release on host
        id: snapshot_previous_release
        # Before overwriting the live path we stash a dated copy next to
        # it. Keeps last 5 snapshots. One-line rollback from host:
        #   rsync -az --delete <path>-history/<sha>-<ts>/ <path>/
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA:0:12}
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          ssh "$PROD_USER@$PROD_HOST" bash -s <<EOF
          set -euo pipefail
          for base in "$PROD_LANDING_PATH" "$PROD_APP_PATH"; do
            hist="\${base}-history"
            if mkdir -p "\$hist"; then
              if [ -d "\$base" ] && [ "\$(ls -A "\$base" 2>/dev/null)" ]; then
                cp -a "\$base" "\$hist/${SHA}-${TS}" || echo "::warning::Could not snapshot previous release for \$base"
              fi
              ls -1t "\$hist" 2>/dev/null | tail -n +6 | while read -r old; do
                rm -rf "\$hist/\$old"
              done
            else
              echo "::warning::Could not create \$hist; continuing without release snapshot for \$base"
            fi
          done
          EOF

      - name: Upload landing
        run: |
          rsync -az --delete dist/public-alpha/landing/ \
            "$PROD_USER@$PROD_HOST:$PROD_LANDING_PATH/"

      - name: Upload app
        run: |
          rsync -az --delete dist/public-alpha/app/ \
            "$PROD_USER@$PROD_HOST:$PROD_APP_PATH/"

      - name: Verify deployed release
        env:
          TIDE_VERIFY_LANDING_URL: https://tidesui.pro
          TIDE_VERIFY_APP_URL: https://app.tidesui.pro
          TIDE_VERIFY_API_URL: https://app.tidesui.pro
          TIDE_VERIFY_REQUIRE_SIGNED_OPS: "false"
        run: node scripts/verify-remote-release.mjs

      - name: Verify app
        run: |
          curl --fail --silent --show-error https://app.tidesui.pro/live-rail-pack.json > /dev/null

      - name: Verify landing HTTP security headers
        run: npm run verify:security-headers -- https://tidesui.pro

      - name: Verify app HTTP security headers
        run: npm run verify:security-headers -- https://app.tidesui.pro

      - name: Roll back production after failed verification
        if: failure() && steps.snapshot_previous_release.conclusion == 'success'
        run: |
          set -euo pipefail
          ssh "$PROD_USER@$PROD_HOST" bash -s <<EOF
          set -euo pipefail
          for base in "$PROD_LANDING_PATH" "$PROD_APP_PATH"; do
            hist="\${base}-history"
            latest="\$(ls -1t "\$hist" 2>/dev/null | head -n 1 || true)"
            if [ -z "\$latest" ]; then
              echo "No rollback snapshot found for \$base" >&2
              exit 1
            fi
            rsync -a --delete "\$hist/\$latest/" "\$base/"
          done
          EOF
