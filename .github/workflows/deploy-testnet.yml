name: Deploy Testnet

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: testnet-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build And Deploy Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: testnet
    env:
      PROD_HOST: 188.137.229.201
      PROD_USER: ${{ vars.PROD_DEPLOY_USER || 'tide-deploy' }}
      TIDE_DEPLOY_CHANNEL: testnet
      TIDE_DEPLOY_TARGET: testnet
      PROD_APP_PATH: /var/www/tide/testnet
      TIDE_LANDING_URL: https://tidesui.pro
      TIDE_WORKSPACE_URL: https://testnet.tidesui.pro
      TIDE_LIVE_RAIL_PACK_URL: ${{ secrets.TIDE_LIVE_RAIL_PACK_VERIFY_KEY != '' && secrets.DEV_OPS_BASE_URL != '' && format('{0}/v1/live-rail-pack', secrets.DEV_OPS_BASE_URL) || './live-rail-pack.json' }}
      TIDE_LIVE_RAIL_PACK_FILE: shadow-mode/live-rail-pack.json
      TIDE_LIVE_RAIL_PACK_AUTOLOAD: "true"
      TIDE_LIVE_RAIL_PACK_PREFER_REMOTE: "true"
      TIDE_LIVE_RAIL_PACK_PERSIST: "true"
      TIDE_LIVE_ENABLED: "true"
      TIDE_LIVE_RAIL_PACK_VERIFY_KEY: ${{ secrets.TIDE_LIVE_RAIL_PACK_VERIFY_KEY }}
      TIDE_ALLOW_UNSIGNED_FORECAST: ${{ secrets.TIDE_LIVE_RAIL_PACK_VERIFY_KEY == '' && secrets.DEV_OPS_BASE_URL == '' && 'true' || 'false' }}
      TIDE_VERIFY_SECURITY_HEADERS_REQUIRED: ${{ vars.TIDE_VERIFY_SECURITY_HEADERS_REQUIRED || 'true' }}
      TIDE_SMOKE_REQUIRE_SIGNED_OPS: ${{ vars.TIDE_SMOKE_REQUIRE_SIGNED_OPS || 'false' }}
      TIDE_PLAUSIBLE_DOMAIN: testnet.tidesui.pro
      TIDE_TELEMETRY_BEACON_URL: ${{ secrets.TELEMETRY_BEACON_URL }}
      TIDE_ERROR_BEACON_URL: ${{ secrets.ERROR_BEACON_URL }}
      TIDE_OPS_BASE_URL: ${{ secrets.DEV_OPS_BASE_URL }}
      TIDE_PLAUSIBLE_SCRIPT_URL: ${{ vars.PLAUSIBLE_SCRIPT_URL }}
      TIDE_SUI_NETWORK: testnet
      TIDE_EXECUTION_PROOF_ENABLED: "true"
      TIDE_EXECUTION_PROOF_ALLOW_SIGNING: "true"
      TIDE_POLICY_PACKAGE_ID: ${{ secrets.TIDE_TESTNET_POLICY_PACKAGE_ID }}
      TIDE_POLICY_RAIL_ALLOWLIST_ID: ${{ secrets.TIDE_TESTNET_POLICY_RAIL_ALLOWLIST_ID }}
      TIDE_POLICY_ADMIN_CAP_ID: ${{ secrets.TIDE_TESTNET_POLICY_ADMIN_CAP_ID }}
      TIDE_PYTH_BTC_USD_PRICE_INFO_OBJECT_ID: ${{ vars.TIDE_PYTH_BTC_USD_PRICE_INFO_OBJECT_ID }}
      TIDE_WALRUS_PUBLISHER_URL: ${{ vars.TIDE_WALRUS_PUBLISHER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pin testnet on-chain ids from proof pack
        run: node scripts/export-testnet-runtime-env.mjs >> "$GITHUB_ENV"

      - name: Validate deploy context
        run: npm run validate:deploy-context

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Lint regulatory copy
        run: npm run lint:regulatory-copy

      - name: Lint Sui chain literals
        run: npm run lint:sui-chain

      - name: Verify Overflow submission pack
        run: npm run verify:overflow

      - name: Collect live rails
        run: npm run collect:live-rails

      - name: Build public alpha bundle
        run: npm run build:public-alpha:configured

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright judge/setup/routing/receipt gate
        run: npm run test:playwright

      - name: Prepare SSH
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
          PROD_SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          out = Path.home() / ".ssh" / "id_ed25519"
          key_b64 = os.environ.get("PROD_SSH_KEY_B64", "").strip()
          key_raw = os.environ.get("PROD_SSH_KEY", "")

          if key_b64:
            data = base64.b64decode(key_b64)
            out.write_bytes(data)
          else:
            if "\\n" in key_raw and "\n" not in key_raw.strip():
              key_raw = key_raw.replace("\\n", "\n")
            key_raw = key_raw.replace("\r\n", "\n").replace("\r", "\n")
            if not key_raw.strip():
              raise SystemExit("PROD_SSH_KEY is empty.")
            out.write_text(key_raw if key_raw.endswith("\n") else key_raw + "\n", encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat > ~/.ssh/config <<'EOF'
          Host *
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 15
            ServerAliveCountMax 8
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config
          if [ -z "${PROD_SSH_HOST_KEY:-}" ]; then
            echo "PROD_SSH_HOST_KEY secret is required for pinned SSH host verification." >&2
            exit 1
          fi
          printf '%s\n' "$PROD_SSH_HOST_KEY" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Ensure target directory exists on host
        run: ssh "$PROD_USER@$PROD_HOST" "mkdir -p '$PROD_APP_PATH'"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-alpha-testnet-${{ github.sha }}
          path: dist/public-alpha/
          retention-days: 14
          if-no-files-found: error

      - name: Snapshot previous release on host
        run: |
          set -euo pipefail
          SHA=${GITHUB_SHA:0:12}
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          ssh "$PROD_USER@$PROD_HOST" bash -s <<EOF
          set -euo pipefail
          base="$PROD_APP_PATH"
          hist="\${base}-history"
          if mkdir -p "\$hist"; then
            if [ -d "\$base" ] && [ "\$(ls -A "\$base" 2>/dev/null)" ]; then
              cp -a "\$base" "\$hist/${SHA}-${TS}" || echo "::warning::Could not snapshot previous testnet release"
            fi
            ls -1t "\$hist" 2>/dev/null | tail -n +6 | while read -r old; do
              rm -rf "\$hist/\$old"
            done
          else
            echo "::warning::Could not create \$hist; continuing without testnet release snapshot"
          fi
          EOF

      - name: Upload app
        run: |
          rsync -az --delete --exclude=/v1/ dist/public-alpha/app/ \
            "$PROD_USER@$PROD_HOST:$PROD_APP_PATH/"

      - name: Verify deployed release
        env:
          TIDE_VERIFY_APP_URL: https://testnet.tidesui.pro
          TIDE_VERIFY_API_URL: https://testnet.tidesui.pro
          TIDE_VERIFY_REQUIRE_SIGNED_OPS: ${{ env.TIDE_SMOKE_REQUIRE_SIGNED_OPS }}
          TIDE_VERIFY_DEPLOY_TARGET: testnet
        run: node scripts/verify-remote-release.mjs

      - name: Verify testnet HTTP security headers
        if: env.TIDE_VERIFY_SECURITY_HEADERS_REQUIRED == 'true'
        run: npm run verify:security-headers -- https://testnet.tidesui.pro
