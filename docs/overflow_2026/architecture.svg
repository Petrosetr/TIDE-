<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">TIDE Autopilot Rehearsal Architecture</title>
  <desc id="desc">Policy draft and rail profile feed an autopilot check, which creates a readout, anchors a Sui testnet policy object, mints an action receipt, and records the result in Workspace. A canonical proof bundle is hashed and pinned into the receipt.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161722"/>
      <stop offset="1" stop-color="#0B0C12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EF2D0"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#6F7A92"/>
    </marker>
    <style>
      .bg { fill: #080910; }
      .shell { fill: url(#panel); stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
      .box { fill: rgba(255,255,255,0.035); stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
      .box-key { fill: rgba(47,123,255,0.10); stroke: rgba(47,123,255,0.55); }
      .box-chain { fill: rgba(46,242,208,0.09); stroke: rgba(46,242,208,0.52); }
      .box-proof { fill: rgba(180,154,255,0.09); stroke: rgba(180,154,255,0.48); }
      .eyebrow { fill: #8E97AD; font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { fill: #F3F6FF; font: 800 34px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; }
      .label { fill: #F3F6FF; font: 800 24px Inter, ui-sans-serif, system-ui, sans-serif; }
      .body { fill: #AAB3C7; font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .tiny { fill: #808AA2; font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; }
      .arrow { stroke: #6F7A92; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-accent { stroke: url(#accent); stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .divider { stroke: rgba(255,255,255,0.10); stroke-width: 1; stroke-dasharray: 7 8; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="920"/>
  <rect x="40" y="36" width="1520" height="848" rx="34" class="shell" filter="url(#softShadow)"/>
  <text x="86" y="92" class="eyebrow">Sui Overflow 2026</text>
  <text x="86" y="138" class="title">TIDE Autopilot Rehearsal Architecture</text>
  <text x="86" y="176" class="body">Decision + policy object + action receipt before mainnet capital moves.</text>
  <line x1="86" y1="222" x2="1514" y2="222" class="divider"/>
  <g transform="translate(86 266)">
    <rect width="258" height="142" rx="20" class="box"/>
    <text x="26" y="38" class="tiny">INPUT</text>
    <text x="26" y="76" class="label">Policy draft</text>
    <text x="26" y="108" class="body">BTC amount, payout,</text>
    <text x="26" y="132" class="body">buffer, LTV band</text>
  </g>
  <g transform="translate(86 494)">
    <rect width="258" height="142" rx="20" class="box"/>
    <text x="26" y="38" class="tiny">CONTEXT</text>
    <text x="26" y="76" class="label">Rail profile</text>
    <text x="26" y="108" class="body">Max LTV, APR, cost,</text>
    <text x="26" y="132" class="body">freshness digest</text>
  </g>
  <g transform="translate(438 380)">
    <rect width="270" height="164" rx="22" class="box box-key"/>
    <text x="28" y="42" class="tiny">ENGINE</text>
    <text x="28" y="82" class="label">Autopilot check</text>
    <text x="28" y="116" class="body">Observe, Maintain,</text>
    <text x="28" y="140" class="body">BuildBuffer, DeRisk,</text>
    <text x="28" y="164" class="body">StressLockdown</text>
  </g>
  <g transform="translate(804 380)">
    <rect width="252" height="164" rx="22" class="box box-key"/>
    <text x="28" y="42" class="tiny">OPERATOR</text>
    <text x="28" y="82" class="label">Readout</text>
    <text x="28" y="116" class="body">State, reason, risk,</text>
    <text x="28" y="140" class="body">and next action</text>
  </g>
  <g transform="translate(1144 266)">
    <rect width="280" height="142" rx="20" class="box box-chain"/>
    <text x="26" y="38" class="tiny">SUI TESTNET</text>
    <text x="26" y="76" class="label">Policy object</text>
    <text x="26" y="108" class="body">Versioned rail +</text>
    <text x="26" y="132" class="body">threshold envelope</text>
  </g>
  <g transform="translate(1144 494)">
    <rect width="280" height="142" rx="20" class="box box-chain"/>
    <text x="26" y="38" class="tiny">SUI TESTNET</text>
    <text x="26" y="76" class="label">Action receipt</text>
    <text x="26" y="108" class="body">Policy id, version,</text>
    <text x="26" y="132" class="body">rail + digests</text>
  </g>
  <g transform="translate(804 668)">
    <rect width="252" height="136" rx="20" class="box box-proof"/>
    <text x="28" y="38" class="tiny">PROOF</text>
    <text x="28" y="74" class="label">SHA-256 digest</text>
    <text x="28" y="106" class="body">Canonical bundle</text>
  </g>
  <g transform="translate(438 668)">
    <rect width="270" height="136" rx="20" class="box box-proof"/>
    <text x="28" y="38" class="tiny">BUNDLE</text>
    <text x="28" y="74" class="label">Policy + report</text>
    <text x="28" y="106" class="body">Digest + Walrus blob</text>
  </g>
  <g transform="translate(86 706)">
    <rect width="258" height="98" rx="18" class="box"/>
    <text x="26" y="38" class="tiny">COCKPIT</text>
    <text x="26" y="74" class="label">Workspace ledger</text>
  </g>
  <path d="M344 337 C382 337 398 462 430 462" class="arrow"/>
  <path d="M344 565 C382 565 398 462 430 462" class="arrow"/>
  <path d="M708 462 H796" class="arrow-accent"/>
  <path d="M1056 430 C1102 430 1092 337 1136 337" class="arrow"/>
  <path d="M1284 408 V486" class="arrow"/>
  <path d="M708 736 H796" class="arrow"/>
  <path d="M930 668 V552" class="arrow"/>
  <path d="M1056 462 C1098 462 1100 565 1136 565" class="arrow"/>
  <path d="M1144 610 C936 840 430 820 344 755" class="arrow"/>
  <text x="86" y="846" class="tiny">Boundary: testnet-only Autopilot Rehearsal. No mainnet capital movement. Wallet signs every on-chain action.</text>
</svg>
